name: CI — Quality, Security & Production Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# Least-privilege permissions: read-only access to repository contents
permissions:
  contents: read

# Cancel redundant in-progress runs on the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Lint, Typecheck, Test, Audit & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 LTS with npm cache
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies cleanly from lockfile
        run: npm ci

      - name: Audit dependencies for high/critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Run TypeScript strict type-checking
        run: npm run typecheck

      - name: Run ESLint static code analysis
        run: npm run lint

      - name: Run unit & integration test suite (Vitest)
        run: npm test

      - name: Build production static bundle
        run: npm run build

      - name: Verify healthcheck endpoint exists in production bundle
        run: |
          test -f dist/health.json
          grep -q '"status": "ok"' dist/health.json

      - name: Upload production build artifact (dist/)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: production-dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
